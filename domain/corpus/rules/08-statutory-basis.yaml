# Statutory Basis Quick Reference
# Category: STATUTORY_BASIS
# Snapshot date: 2026-09-11

rules:

  - id: SB-001
    rule: >
      Prevention of Money-Laundering Act, 2002 (Act 15 of 2003) is the primary statute
      governing AML obligations for Reporting Entities in India. It establishes the
      obligations to maintain records, file reports with FIU-IND, and designate a
      Principal Officer.
    category: STATUTORY_BASIS
    subcategory: PMLA_2002
    applies_to:
      - all_reporting_entities
    primary_source:
      document: "Prevention of Money-Laundering Act, 2002 (as amended)"
      url: "https://www.indiacode.nic.in/handle/123456789/2205"
      url_verified: false
      section: "Act 15 of 2003"
      accessed_date: null
    effective_date: null  # in-force date NEEDS-VERIFICATION — see gap DG-11
    evidence_level: PROVEN
    my_synthesis: >
      PMLA is the parent statute. All product citations should trace back to PMLA
      provisions where possible. Secondary sources (FIU-IND circulars, RBI Master
      Directions) are delegated instruments under PMLA authority.
    last_verified: null
    snapshot_date: "2026-09-11"
    gap_notes: >
      Verify exact in-force date of PMLA 2002. Confirm which version of the India
      Code URL corresponds to the current consolidated version (post-2023 amendments).
      The 2023 PMLA amendment expanded the definition of "proceeds of crime" and
      the list of Reporting Entities — verify exact changes.
    related_rules:
      - STR-001
      - SB-002
      - SB-003

  - id: SB-002
    rule: >
      PMLA 2002, Section 12(1)(b) imposes the obligation on Reporting Entities to
      furnish information in respect of transactions that may constitute a suspicious
      transaction, to the Director, FIU-IND.
    category: STATUTORY_BASIS
    subcategory: PMLA_S12_1B
    applies_to:
      - all_reporting_entities
    primary_source:
      document: "Prevention of Money-Laundering Act, 2002 — Section 12(1)(b)"
      url: "https://www.indiacode.nic.in/handle/123456789/2205"
      url_verified: false
      section: "Section 12(1)(b)"
      accessed_date: null
    effective_date: null
    evidence_level: PROVEN
    my_synthesis: >
      This is the STR statutory basis. All product STR-related output should cite
      "PMLA 2002 s.12(1)(b)" as the authority for the filing obligation.
    last_verified: null
    snapshot_date: "2026-09-11"
    gap_notes: "Verify s.12(1)(b) text unchanged in current consolidated PMLA. Check 2023 amendment impact."
    related_rules:
      - STR-001
      - SB-001

  - id: SB-003
    rule: >
      PMLA 2002, Section 12A prohibits tipping-off: a Reporting Entity and its officers
      must not disclose to the person concerned, or to any other person, that an STR
      has been filed or is being contemplated in respect of that person. The prohibition
      extends to disclosure by any officer of the RE. The PMLA Prevention of
      Money-Laundering Rules, 2005, Rule 8(6) further provides that the RE shall
      take measures to ensure STR information is not disclosed.
    category: STATUTORY_BASIS
    subcategory: PMLA_S12A_TIPPING_OFF
    applies_to:
      - all_reporting_entities
    primary_source:
      document: "Prevention of Money-Laundering Act, 2002 — Section 12A; PML Rules 2005 Rule 8(6)"
      url: "https://www.indiacode.nic.in/handle/123456789/2205"
      url_verified: false
      section: "Section 12A; Rule 8(6) of PML Rules 2005"
      accessed_date: null
    effective_date: null
    evidence_level: PROVEN
    my_synthesis: >
      The tipping-off prohibition is not merely operational guidance — it is a
      statutory provision (s.12A) reinforced by delegated rules (Rule 8(6)). Violating
      it exposes individual officers to criminal liability. Product access controls
      must be designed to prevent accidental disclosure. The STR workflow must not
      surface the filing status (FILE/NOT_FILE) to anyone other than authorised staff.
    last_verified: null
    snapshot_date: "2026-09-17"
    gap_notes: >
      Verify exact subsection numbering: some consolidated PMLA versions place the
      tipping-off prohibition under s.12(2) as well as s.12A. Confirm which subsections
      apply post-2023 amendment. Verify Rule 8(6) text of PML Rules 2005.
    related_rules:
      - STR-004
      - SB-001

  - id: SB-004
    rule: >
      RBI Master Direction on Know Your Customer (KYC), issued under sections 35A and
      56 of the Banking Regulation Act, 1949, establishes KYC obligations and the
      customer risk-categorisation framework for banking companies. It defines PEPs,
      beneficial ownership, and enhanced due diligence requirements.
    category: STATUTORY_BASIS
    subcategory: RBI_KYC_MASTER_DIRECTION
    applies_to:
      - banking_companies
    regulatory_perimeter:
      jurisdiction: India
      statute: "Banking Regulation Act, 1949 (ss.35A, 56); PMLA 2002"
      regulators: [RBI]
      entity_types: [banking_companies]
      excludes:
        - NBFCs_not_regulated_by_RBI
        - payment_aggregators
        - virtual_asset_service_providers
        - entities_regulated_by_SEBI_IRDAI_PFRDA_only
      perimeter_note: >
        This rule applies only within the RBI-regulated entity perimeter. For entities
        regulated by SEBI, IRDAI, or PFRDA, equivalent KYC norms are issued by those
        regulators and are outside the scope of this corpus entry. A query for an IFSC
        or securities firm should not retrieve this rule as the primary authority.
    primary_source:
      document: "RBI Master Direction on KYC — DBR.AML.BC.No.81/14.01.001/2015-16 (as updated)"
      url: "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=11566"
      url_verified: false
      section: "Full document"
      accessed_date: null
    effective_date: "2016-02-25"
    evidence_level: ASSUMED
    my_synthesis: >
      The KYC Master Direction is the operational backbone for customer risk profiling
      within RBI-regulated entities. The PO evaluation factors (POE-002 to POE-012)
      rely on the risk categories and EDD/SDD frameworks established here. The product
      should reference the current version; it is updated periodically by RBI circular.
      When surfacing this rule for a non-banking entity, add a disclaimer that the
      applicable KYC norms depend on the entity's sectoral regulator.
    last_verified: null
    snapshot_date: "2026-09-17"
    gap_notes: >
      Verify that the RBI URL (id=11566) still resolves to the current KYC Master
      Direction. Verify the latest amendment date of the Master Direction — it was
      last significantly amended in 2023. Confirm whether SEBI/IRDAI/PFRDA have
      issued harmonised KYC norms that would extend parts of this direction to
      non-banking entities.
    related_rules:
      - POE-004
      - POE-012
      - RFI-009

  - id: SB-005
    rule: >
      The FATF Recommendations (40 Recommendations, last revised 2022) are the
      international standard for AML/CFT compliance. India is a FATF member and
      its domestic AML legislation is required to comply with these standards.
      FATF Mutual Evaluation findings directly influence RBI and FIU-IND guidance.
    category: STATUTORY_BASIS
    subcategory: FATF_RECOMMENDATIONS
    applies_to:
      - all_reporting_entities
    primary_source:
      document: "FATF Recommendations 2012 (updated to 2022)"
      url: "https://www.fatf-gafi.org/en/topics/fatf-recommendations.html"
      url_verified: false
      section: "Recommendations 9–23 (financial institutions)"
      accessed_date: null
    effective_date: "2012-02-16"  # original 2012 adoption; updated Oct 2022
    evidence_level: ASSUMED
    my_synthesis: >
      FATF provides the framework; India's PMLA and FIU-IND guidelines implement it.
      When a domestic provision lacks specificity, FATF guidance provides interpretive
      support but is not directly enforceable in India. The product should cite
      FATF guidance as secondary context, not as primary authority.
    last_verified: null
    snapshot_date: "2026-09-11"
    gap_notes: "Verify latest FATF Recommendation version (2022 revision). Confirm India FATF Mutual Evaluation status."
    related_rules:
      - POE-011
      - RFI-008
